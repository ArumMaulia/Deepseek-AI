<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATBOT AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Tema Pink: Sakura Candy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-50:  #fff5f9;
            --pink-100: #ffe3ee;
            --pink-200: #ffc9dd;
            --pink-300: #ffa6c6;
            --pink-400: #ff7eb0;
            --pink-500: #f95a98;
            --pink-700: #c2255c;
            --ink:      #5a1f3a;
            --glass:    rgba(255, 255, 255, 0.55);
            --shadow:   0 12px 40px rgba(249, 90, 152, 0.25);
        }

        /* ---------- Latar: gradasi bergerak + gumpalan blur ---------- */
        body {
            font-family: 'Quicksand', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(120deg, #ffe3ee, #ffd1e6, #fff0f6, #ffc4dd) !important;
            background-size: 300% 300% !important;
            animation: drift 14s ease infinite;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            pointer-events: none;
        }
        body::before {
            width: 340px; height: 340px;
            top: -90px; left: -90px;
            background: var(--pink-300);
        }
        body::after {
            width: 400px; height: 400px;
            bottom: -120px; right: -100px;
            background: #ff9ccb;
        }

        @keyframes drift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        /* ---------- Judul ---------- */
        h2 {
            font-family: 'Pacifico', cursive;
            font-weight: 400;
            text-align: center;
            font-size: 2.4rem;
            background: linear-gradient(90deg, var(--pink-500), var(--pink-700));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2::before { content: "✿ "; -webkit-text-fill-color: var(--pink-400); }
        h2::after  { content: " ✿"; -webkit-text-fill-color: var(--pink-400); }

        /* ---------- Kartu kaca ---------- */
        .card {
            max-width: 640px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.75rem;
            box-shadow: var(--shadow);
        }

        /* ---------- Area percakapan: motif polkadot ---------- */
        #chat-container {
            background-color: var(--pink-50);
            background-image: radial-gradient(var(--pink-200) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
            border: 2px dashed var(--pink-300) !important;
            border-radius: 1.25rem;
            scrollbar-width: thin;
            scrollbar-color: var(--pink-300) transparent;
        }
        #chat-container::-webkit-scrollbar { width: 8px; }
        #chat-container::-webkit-scrollbar-thumb {
            background: var(--pink-300);
            border-radius: 8px;
        }

        /* ---------- Bubble chat ---------- */
        #chat-container > div {
            width: fit-content;
            max-width: 82%;
            padding: 0.55rem 1rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        /* Pesan user (kanan) */
        #chat-container > .text-end {
            margin-left: auto;
            color: #fff;
            background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
            border-radius: 1.2rem 1.2rem 0.3rem 1.2rem;
            box-shadow: 0 4px 12px rgba(249, 90, 152, 0.35);
        }

        /* Pesan AI (kiri) */
        #chat-container > div:not(.text-end) {
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--pink-200);
            border-radius: 1.2rem 1.2rem 1.2rem 0.3rem;
            box-shadow: 0 4px 12px rgba(255, 166, 198, 0.3);
        }
        #chat-container > div:not(.text-end) strong { color: var(--pink-700); }

        /* ---------- Input & tombol berbentuk pil ---------- */
        .form-control {
            font-family: inherit;
            color: var(--ink);
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--pink-200);
            border-radius: 50rem 0 0 50rem;
            padding-left: 1.2rem;
        }
        .form-control::placeholder { color: var(--pink-300); }
        .form-control:focus {
            border-color: var(--pink-400);
            box-shadow: 0 0 0 0.25rem rgba(255, 126, 176, 0.25);
        }

        .btn-primary {
            font-family: inherit;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 0 50rem 50rem 0;
            padding-inline: 1.5rem;
            background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary::after { content: " ♡"; }
        .btn-primary:hover,
        .btn-primary:focus {
            color: #fff;
            background: linear-gradient(135deg, var(--pink-500), var(--pink-700));
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(249, 90, 152, 0.4);
        }
        .btn-primary:active {
            color: #fff;
            transform: translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
            .btn-primary { transition: none; }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <h2 class="mb-4">DeepSeek AI</h2>

        <div class="card">
            <div class="card-body">

                <div id="chat-container" class="mb-3" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;">
                </div>

                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">

                    <button id="send-btn" class="btn btn-primary" onclick="sendMessage()">
                        Send
                    </button>
                </div>

            </div>
        </div>

    </div>


    <script>
    async function sendMessage() {
        const userInput = document.getElementById('user-input');
        const message = userInput.value;

        if (!message) return;

        // DIPERBAIKI: chat-box → chat-container
        const chatBox = document.getElementById('chat-container');

        chatBox.innerHTML += `<div class="mb-2 text-end"><strong>You:</strong> ${message}</div>`;

        // Kirim pesan ke Flask
        const response = await fetch('/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: message
            })
        });

        // Ambil jawaban dari Flask
        const data = await response.json();
        console.log(data.response);  // Debug: Tampilkan jawaban di console

        // Tampilkan jawaban AI
        chatBox.innerHTML += `<div class="mb-2"><strong>AI:</strong> ${data.response}</div>`;

        // Kosongkan input
        userInput.value = '';

        // Scroll ke bawah
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxC" crossorigin="anonymous"></script>

</body>
</html>
